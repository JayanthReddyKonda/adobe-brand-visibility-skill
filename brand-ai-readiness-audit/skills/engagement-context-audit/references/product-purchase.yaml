# User Intent: Product Purchase & Evaluation
intent_family: product_purchase
description: "Visitor arriving from an AI search query with intent to evaluate specifications, pricing, and availability to make a purchasing decision."

question_patterns:
  - "what is {product_name}"
  - "how much does {product_name} cost"
  - "where can I buy {product_name}"
  - "is {product_name} currently in stock"
  - "{product_name} specifications and flight time"

required_on_page_facts:
  - product_name
  - numerical_price
  - currency_symbol
  - availability_state
  - primary_specifications
  - purchasing_or_inquiry_cta

preferred_target_surfaces:
  - "/products/{product_slug}"
  - "/store/{product_slug}"
  - "/catalog/{category}/{product_slug}"

continuity_failure_indicators:
  - "Landing URL redirects to generic un-annotated homepage"
  - "Product price missing from above-the-fold hero section"
  - "No visible Add to Cart or Request Quote CTA"

